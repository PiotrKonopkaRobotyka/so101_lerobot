# Parameters of the hand_teleop node. Floats need a decimal point: ROS 2 rejects 10 for a float parameter.
hand_teleop:
  ros__parameters:
    model_path: ""        # empty: $DATA_DIR/models/hand_landmarker.task (default ~/data/models)
    camera_index: 0       # /dev/video0
    # video_path (a video file instead of the webcam) and preview (the window) come from the launch arguments
    # video:= and preview:=; a value here would override them (launch writes its parameters under /**)

    # Aperture (thumb-index gap / palm length) of the closed and the open hand, seen from the front (ADR 0006).
    # Press c / o in the preview to measure yours; the node prints the values to paste here. These: my hand in the
    # ROB-34 recording of 2026-11-11 (closed 0.31-0.39, open 1.09-1.21). From the side they were 0.11 and 2.28.
    aperture_closed: 0.36
    aperture_open: 1.13

    ema_alpha: 0.4        # smoothing of the openness and the palm: 1.0 = none; 0.4 lags about 50 ms at 20 fps
    hold_s: 0.5           # hand lost for longer: no more goals, the gripper and the arm stay where they are
    rate_hz: 10.0         # goals per second
    move_time_s: 0.1      # time_from_start of each goal

    # Stage 2 (ADR 0006, ADR 0007): the hand over the workspace seen from above, while following (space / ~/clutch)
    # arm (default false): set by the launch argument arm:=true; the arm first goes to the home pose. Not set here:
    # launch passes it under /**, and a value under hand_teleop in this file would override it.
    px_per_m: 800.0       # preview pixels per metre of table: 10 cm of table = 80 px, about 8 cm of hand at 55 cm
    axis_px: [320.0, 440.0]   # where the arm's pan axis is in the raw 640x480 frame: bottom centre, 40 px up
    bounds_reach: [0.12, 0.34]   # metres from the pan axis where TCP targets may go (the drawn sector)
    bounds_pan: [-1.0472, 1.0472]   # joint 1 in radians, + = the robot's right: +-60 deg keeps the hand in the frame
    bounds_height: [0.02, 0.40]  # metres up; 0.02 keeps the jaws off the floor
    hover_height: 0.08    # TCP height between grasps (the key z or ~/grasp toggles the levels)
    grasp_height: 0.02    # TCP height at the grasp
    pitch_range: [-1.5708, -0.7854]  # jaws' pitch: the steepest the arm reaches, from straight down to 45 deg
    max_step_m: 0.02      # largest TCP step over the table per camera frame (0.4 m/s at 20 fps)
    max_step_height_m: 0.005  # largest TCP step up or down per camera frame (0.1 m/s at 20 fps)
